name: release

# v* tags publish a release (GitHub Release assets + versioned GHCR image); pushes to main publish the `edge` image.
on:
  push:
    tags: ["v*"]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      major: ${{ steps.version.outputs.major }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Tag matches agentless.__version__
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv run --frozen python -c 'import agentless; print(agentless.__version__)')"
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ "${TAG#v}" != "$version" ]]; then
              echo "::error::tag $TAG does not match agentless.__version__ ($version)"; exit 1
            fi
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              prerelease=false
            elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+$ ]]; then
              prerelease=true
            else
              echo "::error::$version is not X.Y.Z or X.Y.Z{a,b,rc}N"; exit 1
            fi
          else
            prerelease=true
          fi
          IFS=. read -r major minor _ <<<"$version"
          {
            echo "version=$version"
            echo "major=$major"
            echo "minor=$major.$minor"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"
          echo "version=$version prerelease=$prerelease ref=$REF_TYPE"
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
      - run: uv run pytest -q
      - name: Release notes exist in CHANGELOG.md
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/release-notes.sh "$VERSION"

  build:
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv build
      - name: Wheel installs and reports the tagged version
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          got="$(uvx --from "dist/agentless_cli-${VERSION}-py3-none-any.whl" agentless version)"
          [[ "$got" == "$VERSION" ]] || { echo "::error::wheel reports $got, expected $VERSION"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pre-releases get only their exact version; X.Y, X and latest move on final releases only.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ needs.verify.outputs.minor }},enable=${{ github.ref_type == 'tag' && needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=${{ needs.verify.outputs.major }},enable=${{ github.ref_type == 'tag' && needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref_type == 'branch' }}
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the image by digest (keyless)
        env:
          REPO: ${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${REPO,,}@${DIGEST}"

  github-release:
    needs: [verify, build, image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Checksums
        run: |
          cp schema/agent.schema.json dist/
          (cd dist && sha256sum -- * > ../SHA256SUMS) && mv SHA256SUMS dist/
          cat dist/SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          bash .github/scripts/release-notes.sh "$VERSION" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi
          if [[ "$PRERELEASE" == "true" ]]; then kind=--prerelease; else kind=--latest; fi
          gh release create "$TAG" dist/* --verify-tag --title "agentless $VERSION" --notes-file notes.md "$kind"
