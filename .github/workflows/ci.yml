name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run ty check src
      - run: uv run pytest -q
      - name: Committed JSON schema matches the config model
        run: |
          uv run agentless schema -o "$RUNNER_TEMP/agent.schema.json"
          diff -u schema/agent.schema.json "$RUNNER_TEMP/agent.schema.json" \
            || { echo "::error::schema/agent.schema.json is stale; run 'uv run agentless schema -o schema/agent.schema.json'"; exit 1; }

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentless:ci .
      - run: docker run --rm agentless:ci version
