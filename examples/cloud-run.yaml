# yaml-language-server: $schema=../schema/agent.schema.json
# An agent deployed as a Cloud Run service. Callers always need roles/run.invoker: the service is never public
# (except with auth: webhook, where allUsers holds it and the container checks a shared secret).
service: support-agent

provider:
  name: cloud-run
  stage: ${opt:stage, 'dev'}
  project: ${param:project}
  region: europe-west1
  stagingBucket: acme-agentless-${stage}   # holds state and the uploaded source Cloud Build reads
  labels: { team: support, env: "${stage}" }
  deployer:
    impersonate: ${param:deployer}         # also mints the ID token used to read the agent card

stages:
  dev:
    params: { project: acme-agents-dev, deployer: sa-deployer@acme-agents-dev.iam.gserviceaccount.com }
  prod:
    params: { project: acme-agents-prod, deployer: sa-deployer@acme-agents-prod.iam.gserviceaccount.com }

cloudRun:
  # image: europe-west1-docker.pkg.dev/acme-ci/agents/support-agent:1.4.0   # prebuilt in CI: no source build
  artifactRegistry: cloud-run-source-deploy   # Docker repository in provider.region; must already exist
  ingress: internal                        # network restriction on top of IAM, never instead of it
  # iap: true                              # Identity-Aware Proxy in front of the service (beta)
  # auth: googleToken                      # public endpoint with a second, app-level check (needs ingress: all):
  # googleToken:                           #   Cloud Run still checks roles/run.invoker (X-Serverless-Authorization),
  #   header: x-google-token               #   then the container verifies the Google token in this header
  #   allowedPrincipals: [domain:acme.example.com]
  # auth: webhook                          # GitLab/GitHub webhook receiver: IAM stays on, allUsers may invoke, and
  # webhook:                               #   the container checks the shared secret in this header (verified
  #                                        #   after each rollout; needs the DRS exemption tag in tags)
  #   header: x-gitlab-token
  #   secret: { secret: gitlab-webhook-token }
  # tags:                                  # bound on the service before it opens (org policies such as
  #   "123456789012/allowIngressAllForCloudRun": allow-ingress-all   #   run.allowedIngress check them)
  vpcEgress: { network: acme-vpc, subnetwork: agents-europe-west1, egress: private-ranges-only }
  timeout: 600s
  cpuThrottling: false
  sessionAffinity: true

agent:
  description: Answers internal support questions
  runtime: { cpu: "1", memory: 4Gi, minInstances: 0, maxInstances: 10, concurrency: 8 }
  environment:
    TICKETS_API: https://tickets.internal.example.com
  secrets:
    TICKETS_TOKEN: { secret: tickets-api-token }

identity:
  type: serviceAccount                     # the only identity type on Cloud Run
  serviceAccount: { name: "sa-support-${stage}" }
  roles:
    project: [roles/aiplatform.user]

access:
  invokers:                                # granted roles/run.invoker on the service; allUsers is rejected
    - group:support-tools@acme.example.com
    - serviceAccount:ticket-bot@acme-tools.iam.gserviceaccount.com

memory:
  sessions: agentPlatform                  # creates a companion engine (no code) for sessions; inMemory skips it
  memoryBank: { generationModel: gemini-2.5-flash, embeddingModel: text-embedding-005 }

publish:
  geminiEnterprise:
    app: projects/123456789/locations/global/collections/default_collection/engines/support-app
    # registration is a2a on Cloud Run; the app's service agent gets roles/run.invoker
  agentRegistry: {}
